name: Public question bank update
on:
  # Daily schedule paused: the companion returns HTTP 403 to GitHub runners.
  # Enable only when a permitted feed or source access is available.
  # schedule:
  #   - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: question-bank-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Import validated public records and build the bank
        run: node scripts/sync-recorded.js
      - name: Validate the game and bank
        run: npm test
      - name: Save new questions
        run: |
          if git diff --quiet -- data/recorded.json data/questions.json; then
            echo "No bank changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recorded.json data/questions.json
          git commit -m "data: refresh public recorded questions"
          git push
